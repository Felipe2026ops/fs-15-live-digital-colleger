<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=for, initial-scale=1.0">
    <title>Formulario para interação com usuario</title>
</head>
<body>
    <form>
            <input type="text" name="user_name" placeholder="Digite seu nome"required/>
            <input type="number" name="user_cpf" placeholder="Digite o Seu CPF"/>
            <input type="password" name="user_password" placeholder="Digite Sua Senha"/>
            <input type="data" name="user_birthdate">
            <input type="time" name="user_breackfast_hour">
            <input type="email" name="user_email" placeholder="Digite Seu Melhor email"required>
            <input type="file" name="user_resumer">
            <div>
            <input type="checkbox" name="user_disabilitie" placeholder="disabilities"/>
            <label>Precisa de auxilio para execultar as atividades</label>
            </div>
            <label>Já trabalhou na empresa anteriormente ?</label>
            <input type="radio" name="user_worker">
            <label>Sim</label>
            <input type="radio" name="user_worker">
            <label>Não</label>
            <select name="user_city">
                <option value="Fortaleza">Fortaleza</option>
                <option value="São_Paulo">São Paulo</option>
                <option value="Baixada_Fluminense">Baixada Fluminense</option>
                <option value="João_Pessoa">oão Pessoa</option>
            </select>
            <div>
                <textarea name="user_cover" rows=""></textarea>
            </div>
            <button type="submit">Enviar</button>
    </form>
</body>
</html>
